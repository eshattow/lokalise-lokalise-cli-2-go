version: 2

builds:
  -
    id: lokalise2
    env:
      - CGO_ENABLED=0
    binary: lokalise2
    goos:
      - darwin
      - windows
      - linux
      - freebsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386

archives:
  - format_overrides:
      - goos: windows
        formats: ["zip"]

    name_template: 'lokalise2_{{ .Os }}_{{ if eq .Arch "386" }}i386{{ else }}{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - none*

brews:
  - repository:
      owner: lokalise
      name: homebrew-cli-2
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lokalise/lokalise-cli-2-go"
    description: "Lokalise CLI v2"
    skip_upload: false
    name: lokalise2
    install: |
      bin.install "lokalise2"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc

dockers_v2:
  - dockerfile: Dockerfile.goreleaser
  - images:
      - lokalise/lokalise-cli-2
      - ghcr.io/lokalise/lokalise-cli-2
    extra_files:
      - /etc/ssl/certs/
  - platforms:
      - linux/amd64
      - linux/arm64/v8

release:
  github:
    owner: lokalise
    name: lokalise-cli-2-go
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  make_latest: true
  mode: append
  name_template: "Release {{ .Tag }}"
